<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CNEL Analytics{% endblock %}</title>
    
    <!-- Estilos CSS del Proyecto -->
    <link rel="stylesheet" href="/static/css/index.css">
    <!-- FontAwesome (Iconos) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SweetAlert2 (Alertas) -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Chart.js (Gráficos) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    {% block extra_head %}{% endblock %}
</head>
<body>

    <div class="app-layout">
        <!-- BARRA LATERAL (SIDEBAR) -->
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-icon">
                    <i class="fa-solid fa-bolt"></i>
                </div>
                <h2>CNEL<br><span>ANALYTICS</span></h2>
            </div>

            <nav class="sidebar-menu">
                <a href="/info-cliente" class="menu-item {% if active_page == 'info-cliente' %}active{% endif %}">
                    <i class="fa-solid fa-user"></i>
                    <span>INFO CLIENTE</span>
                </a>
                <a href="/estado-cuenta" class="menu-item {% if active_page == 'estado-cuenta' %}active{% endif %}">
                    <i class="fa-solid fa-chart-line"></i>
                    <span>ESTADO DE CUENTA</span>
                </a>
                <a href="/estcta-sico" class="menu-item {% if active_page == 'estcta-sico' %}active{% endif %}">
                    <i class="fa-solid fa-comment-dots"></i>
                    <span>ESTCTA SICO</span>
                </a>
                <a href="/consumo" class="menu-item {% if active_page == 'consumo' %}active{% endif %}">
                    <i class="fa-solid fa-bolt-lightning"></i>
                    <span>CONSUMO</span>
                </a>
                <a href="/lectura" class="menu-item {% if active_page == 'lectura' %}active{% endif %}">
                    <i class="fa-solid fa-gauge-high"></i>
                    <span>LECTURA</span>
                </a>
                <a href="/config" class="menu-item {% if active_page == 'config' %}active{% endif %}">
                    <i class="fa-solid fa-gear"></i>
                    <span>CONFIGURACION</span>
                </a>
                <button class="menu-item logout" onclick="cerrarSesion()">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>CERRAR SESION</span>
                </button>
            </nav>
        </aside>

        <!-- CONTENIDO PRINCIPAL -->
        <main class="main-content">
            <!-- HEADER SUPERIOR (NAVBAR) -->
            <header class="top-header">
                <div class="search-bar">
                    <i class="fa-solid fa-magnifying-glass" onclick="buscarCliente()" style="cursor:pointer;"></i>
                    <input type="text" id="codigoUsuario" placeholder="código de usuario" onkeypress="handleSearch(event)">
                </div>
                <div class="user-greeting">
                    <span>Hola, <strong id="userName">{{ user.username if user else 'Usuario' }}</strong></span>
                </div>
            </header>

            <!-- BLOQUE DINÁMICO DE CONTENIDO POR MÓDULO -->
            <div class="module-container">
                {% block content %}
                <!-- El contenido de cada vista se inyectará aquí -->
                {% endblock %}
            </div>
        </main>
    </div>

    <!-- Script Principal -->
    <script src="/static/js/index.js"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
